name: Invicti Security Scan

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  invicti-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Invicti Enterprise Scan
        uses: invicti/enterprise-scan-action@v1.0.0
        with:
          url: 'https://your-target-website.com'
          user-id: ${{ secrets.INVICTA_USER_ID }}
          api-token: ${{ secrets.INVICTA_API_TOKEN }}
          scan-profile: 'Full Scan'
